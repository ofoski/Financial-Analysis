name: Test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - working-directory: deployment
        run: pip install -r requirements.txt pytest

      - working-directory: deployment
        run: pytest tests/ -v
